services:
  backend:
    build: ./tickets-api
    container_name: tickets_backend
    restart: always
    ports:
      - "3002:3002"
    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: 
      DB_NAME: tickets_db
      PORT: 3002
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./itesz-react-full
    container_name: tickets_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend