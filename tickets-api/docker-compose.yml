services:
  db:
    image: mysql:8.0
    container_name: tickets_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Escuela123
      MYSQL_DATABASE: tickets_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./tickets-api
    container_name: tickets_api
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: Escuela123
      DB_NAME: tickets_db
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: